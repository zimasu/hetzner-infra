---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - htop
      - vim
      - ufw
      - fail2ban
    state: present

- name: Create zimasu user
  ansible.builtin.user:
    name: zimasu
    shell: /bin/bash
    groups: sudo
    append: true

- name: Add SSH key for zimasu
  ansible.posix.authorized_key:
    user: zimasu
    state: present
    key: "{{ zimasu_ssh_key }}"

- name: Deploy sshd hardening config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0600'
  notify:
    - restart sshd

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: SSH

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
    comment: HTTP

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
    comment: HTTPS

- name: Allow k3s API
  community.general.ufw:
    rule: allow
    port: '6443'
    proto: tcp
    comment: k3s API

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
