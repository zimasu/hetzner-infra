apiVersion: v1
kind: Service
metadata:
  name: bookstack
  namespace: bookstack
spec:
  type: ClusterIP
  selector:
    app: bookstack
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bookstack-mysql
  namespace: bookstack
spec:
  type: ClusterIP
  selector:
    app: bookstack-mysql
  ports:
    - port: 3306
      targetPort: 3306
