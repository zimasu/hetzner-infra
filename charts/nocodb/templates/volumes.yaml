apiVersion: v1
kind: PersistentVolume
metadata:
  name: noco-data-pv
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /opt/noco/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: noco-data-pvc
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: noco-data-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: noco-db-pv
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /opt/noco/db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: noco-db-pvc
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: noco-db-pv
